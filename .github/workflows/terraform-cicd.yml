name: Terraform Deployment pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: development

    
    env:
      WORKSPACE_NAME: development

    defaults:
      run:
        working-directory: ./terraform-github-actions-OIDC

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::127854692984:role/vaishu-oidc
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ env.WORKSPACE_NAME }} ||           terraform workspace new ${{ env.WORKSPACE_NAME }}

      - name: Terraform Plan
        run: |
          terraform plan \
          -input=false \
          -out=tfplan

      - name: Check Terraform Plan
        run: |
          echo "Current directory:"
                pwd

          echo "Files:"
            ls -la

          echo "Searching for tfplan:"
          find . -name "tfplan" -type f -print

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            **/tfplan
          if-no-files-found: error
          retention-days: 1


  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: development


    env:
      WORKSPACE_NAME: development

    defaults:
      run:
        working-directory: ./terraform-github-actions-OIDC  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::127854692984:role/vaishu-oidc
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ env.WORKSPACE_NAME }} ||           terraform workspace new ${{ env.WORKSPACE_NAME }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
